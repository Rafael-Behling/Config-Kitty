# ── Fonte ─────────────────────────────────────────────
font_family      JetBrainsMono Nerd Font
bold_font        auto
italic_font      auto
bold_italic_font auto
font_size        12.0

# ── Limpeza / blur ────────────────────────────────────
background_opacity 0.72
background_blur 8
window_padding_width 16
tab_bar_min_tabs 2
enable_audio_bell no
confirm_os_window_close 0

# ── Modernidade ───────────────────────────────────────
cursor_shape beam
cursor_trail 1
scrollback_lines 10000
url_style curly

# ── Tema: Catppuccin Mocha (combina com a galáxia) ────
background            #1e1e2e
foreground            #cdd6f4
cursor                #f5e0dc
url_color             #f5c2e7
selection_background  #f5c2e7
selection_foreground  #1e1e2e

